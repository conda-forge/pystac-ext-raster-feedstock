schema_version: 1

context:
  version: "1.1.1"

package:
  name: pystac-ext-raster
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/p/pystac-ext-raster/pystac_ext_raster-${{ version }}.tar.gz
  sha256: 1249d34332cfd05634a31eb6f9d63d977cef4320d68876054bdbc1319ffc8b8a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
  run:
    - python >=${{ python_min }}
    - pystac-core

tests:
  - python:
      imports:
        - pystac.extensions.raster
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Raster extension for PySTAC
  license: Apache-2.0
  license_file: LICENSE
  homepage: https://pypi.org/project/pystac-ext-raster/
  documentation: https://pystac.readthedocs.io

extra:
  recipe-maintainers:
    - ocefpaf
